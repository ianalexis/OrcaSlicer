name: PR Label Bot

on:
  pull_request_target:
    types:
      - opened
      - reopened
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  request-label:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Ask PR author for label
        uses: actions/github-script@v7
        with:
          script: |
            const allowedLabels = [
              'bug-fix',
              'enhancement',
              'Localization',
              'profile',
              'QoL',
              'UI/UX',
              'dependencies'
            ];
            const pr = context.payload.pull_request;
            const labelsList = allowedLabels.map((label) => `- \`${label}\``).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body:
                `Hi @${pr.user.login}, you can manage labels for this PR with commands.\n\n` +
                `Allowed labels are:\n${labelsList}\n\n` +
                `- \`/LabelBot add:bug-fix\`\n` +
                `- \`/LabelBot remove:bug-fix\`\n\n` +
                `Examples:\n` +
                `/LabelBot add:bug-fix\n` +
                `/LabelBot add:bug-fix, UI/UX\n` +
                `/LabelBot remove:bug-fix, UI/UX`
            });

  apply-label:
    if: github.event_name == 'issue_comment'
    permissions:
      contents: read
      pull-requests: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Apply label command from PR author
        uses: actions/github-script@v7
        with:
          script: |
            const allowedLabels = [
              'bug-fix',
              'enhancement',
              'Localization',
              'profile',
              'QoL',
              'UI/UX',
              'dependencies'
            ];

            const issue = context.payload.issue;
            if (!issue.pull_request) {
              core.info('Ignoring comment that is not on a pull request.');
              return;
            }

            const body = (context.payload.comment.body || '').trim();
            const commandLine = body
              .split('\n')
              .map((line) => line.trim())
              .find((line) => /^\/labelbot\s+(add|remove):/i.test(line));

            if (!commandLine) {
              core.info('No /LabelBot add:label or /LabelBot remove:label command found.');
              return;
            }

            const commandMatch = commandLine.match(/^\/labelbot\s+(add|remove):\s*(.+)\s*$/i);
            if (!commandMatch) {
              core.info('Label command format is invalid.');
              return;
            }

            const action = commandMatch[1].toLowerCase();
            let labelsExpr = (commandMatch[2] || '').trim();
            if (!labelsExpr) {
              core.info('Label command is missing label name.');
              return;
            }

            if (labelsExpr.startsWith('[') && labelsExpr.endsWith(']')) {
              labelsExpr = labelsExpr.slice(1, -1).trim();
            }

            const requestedRawLabels = labelsExpr
              .split(',')
              .map((part) => part.trim())
              .filter(Boolean);

            if (!requestedRawLabels.length) {
              core.info('No labels were provided in the command.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue.number
            });

            const commenter = context.payload.comment.user.login;
            if (commenter !== pr.user.login) {
              core.info('Ignoring command because commenter is not the PR author.');
              return;
            }

            const labelsByLower = new Map(
              allowedLabels.map((label) => [label.toLowerCase(), label])
            );

            const resolvedLabels = [];
            const invalidLabels = [];

            for (const rawLabel of requestedRawLabels) {
              const resolved = labelsByLower.get(rawLabel.toLowerCase());
              if (resolved) {
                resolvedLabels.push(resolved);
              } else {
                invalidLabels.push(rawLabel);
              }
            }

            if (invalidLabels.length) {
              const allowedText = allowedLabels.map((label) => `\`${label}\``).join(', ');
              const invalidText = invalidLabels.map((label) => `\`${label}\``).join(', ');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body:
                  `@${commenter} invalid label(s): ${invalidText}.\n\n` +
                  `Allowed labels: ${allowedText}\n\n` +
                  `Use:\n` +
                  `- \`/LabelBot add:label\`\n` +
                  `- \`/LabelBot remove:label\`\n` +
                  `- \`/LabelBot add:label1, label2\``
              });
              return;
            }

            const uniqueRequestedLabels = [...new Set(resolvedLabels)];

            if (action === 'add') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: uniqueRequestedLabels
              });

              core.info(`Added labels: ${uniqueRequestedLabels.join(', ')}`);
              return;
            }

            let removedCount = 0;
            try {
              for (const label of uniqueRequestedLabels) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: label
                  });
                  removedCount += 1;
                } catch (error) {
                  if (error.status === 404) {
                    core.info(`Label is not currently applied: ${label}`);
                    continue;
                  }

                  throw error;
                }
              }

              core.info(`Removed labels count: ${removedCount}`);
            } catch (error) {
              throw error;
            }

            core.info(`Processed label command: ${action} ${uniqueRequestedLabels.join(', ')}`);

name: Validate Documentation Links

on:
  pull_request:
    paths:
      - 'src/slic3r/GUI/Tab.cpp'
      - 'doc/**/*.md'
  workflow_dispatch:

jobs:
  validate-links:
    runs-on: windows-latest
    name: Check Documentation Links
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run validation
        shell: pwsh
        run: |
          $FolderPath = $PWD
          $RelativeTabPath = "src/slic3r/GUI/Tab.cpp"
          
          $tabFile = Join-Path $FolderPath $RelativeTabPath
          $docDir  = Join-Path $FolderPath 'doc'
          
          # Check required paths
          if (-not (Test-Path $tabFile)) { Write-Error "Tab.cpp file not found at: $tabFile"; exit 1 }
          if (-not (Test-Path $docDir)) { Write-Error "doc folder does not exist at: $docDir"; exit 1 }
          
          # === Build documentation index ===
          $docIndex = @{}
          $mdFiles = Get-ChildItem -Path $docDir -Filter *.md -Recurse -File -ErrorAction SilentlyContinue
          
          if ($mdFiles) {
              foreach ($mdFile in $mdFiles) {
                  $baseName = [System.IO.Path]::GetFileNameWithoutExtension($mdFile.Name)
                  $relPath = (Resolve-Path $mdFile.FullName).Path.Substring($docDir.Length).TrimStart('\', '/')
                  $content = Get-Content -Path $mdFile.FullName -Encoding UTF8 -Raw
                  $lines = Get-Content -Path $mdFile.FullName -Encoding UTF8
                  
                  # Extract anchors
                  $anchors = @()
                  $headerMatches = [regex]::Matches($content, '(?m)^(#+)\s+(.+)$')
                  foreach ($match in $headerMatches) {
                      $headerText = $match.Groups[2].Value.Trim()
                      $headerAnchor = $headerText.ToLower() -replace '\s+', '-' -replace '[^\w\-]', ''
                      $anchors += $headerAnchor
                      $anchors += $headerText.ToLower().Trim()
                  }
                  
                  $anchorMatches = [regex]::Matches($content, '(?i)<a\s+[^>]*(?:name|id)\s*=\s*[`"'']([^`"'']+)[`"''][^>]*>')
                  foreach ($match in $anchorMatches) {
                      $anchors += $match.Groups[1].Value.ToLower()
                  }
                  
                  # Parse markdown links
                  $links = @()
                  $linkRegex = '(?<!!)\[[^\]]*\]\(([^)]+)\)'
                  for ($i = 0; $i -lt $lines.Count; $i++) {
                      foreach ($linkMatch in [regex]::Matches($lines[$i], $linkRegex)) {
                          $destRaw = $linkMatch.Groups[1].Value.Trim()
                          if ($destRaw -match '^(?:https?:|mailto:|data:|#|\\)') { continue }
                          
                          $destParts = $destRaw -split '#', 2
                          $destNoFragment = $destParts[0]
                          $fragment = if ($destParts.Length -gt 1) { $destParts[1] } else { $null }
                          
                          if (-not $destNoFragment) { continue }
                          
                          $leaf = ($destNoFragment -split '[\\/]')[-1]
                          if (-not $leaf) { continue }
                          
                          $targetBase = if ($leaf.ToLower().EndsWith('.md')) { $leaf.Substring(0, $leaf.Length - 3) } else { $leaf }
                          $targetBase = $targetBase.Trim()
                          if (-not $targetBase) { continue }
                          
                          $links += @{
                              TargetBase = $targetBase
                              Fragment = $fragment
                              Line = $i + 1
                              SourceFile = $relPath
                          }
                      }
                  }
                  
                  $docIndex[$baseName] = @{
                      Anchors = $anchors
                      Links = $links
                  }
              }
          }
          
          # === Parse Tab.cpp references ===
          $regex = 'optgroup->append_single_option_line\s*\(\s*(?:"([^"]+)"|([^,]+?))\s*,\s*"([^"]+)"\s*\)'
          $lines = Get-Content -Path $tabFile -Encoding UTF8
          $tabReferences = @()
          $lineNumber = 0
          
          foreach ($line in $lines) {
              $lineNumber++
              foreach ($match in [regex]::Matches($line, $regex)) {
                  $arg2Full = $match.Groups[3].Value.Trim()
                  $arg2Parts = $arg2Full -split '#', 2
                  $arg2Core = $arg2Parts[0].Trim()
                  $fragment = if ($arg2Parts.Length -gt 1) { $arg2Parts[1].Trim() } else { $null }
                  
                  $tabReferences += @{
                      DocBase = $arg2Core
                      Fragment = $fragment
                      Line = $lineNumber
                      SourceFile = "Tab.cpp"
                  }
              }
          }
          
          # === Collect broken references ===
          $brokenReferences = @()
          
          # Check Tab.cpp references
          foreach ($ref in $tabReferences) {
              $docExists = $docIndex.ContainsKey($ref.DocBase)
              
              if ($ref.Fragment -and $ref.Fragment.StartsWith('#')) {
                  $brokenReferences += @{
                      SourceFile = $ref.SourceFile
                      Line = $ref.Line
                      Target = "$($ref.DocBase)#$($ref.Fragment)"
                      Issue = "Double ## reference is not allowed"
                  }
              } elseif (-not $docExists) {
                  $brokenReferences += @{
                      SourceFile = $ref.SourceFile
                      Line = $ref.Line
                      Target = "$($ref.DocBase)"
                      Issue = "File does not exist"
                  }
              } elseif ($ref.Fragment) {
                  $normalizedFragment = $ref.Fragment.ToLower().Trim()
                  $availableAnchors = $docIndex[$ref.DocBase].Anchors
                  if ($availableAnchors -notcontains $normalizedFragment) {
                      $brokenReferences += @{
                          SourceFile = $ref.SourceFile
                          Line = $ref.Line
                          Target = "$($ref.DocBase)#$($ref.Fragment)"
                          Issue = "Fragment does not exist"
                      }
                  }
              }
          }
          
          # Check markdown links
          foreach ($baseName in $docIndex.Keys) {
              $doc = $docIndex[$baseName]
              
              foreach ($link in $doc.Links) {
                  $targetExists = $docIndex.ContainsKey($link.TargetBase)
                  
                  if ($link.Fragment -and $link.Fragment.StartsWith('#')) {
                      $brokenReferences += @{
                          SourceFile = $link.SourceFile
                          Line = $link.Line
                          Target = "$($link.TargetBase).md#$($link.Fragment)"
                          Issue = "Double ## reference is not allowed"
                      }
                  } elseif (-not $targetExists) {
                      $brokenReferences += @{
                          SourceFile = $link.SourceFile
                          Line = $link.Line
                          Target = "$($link.TargetBase).md"
                          Issue = "File does not exist"
                      }
                  } elseif ($link.Fragment) {
                      $normalizedFragment = $link.Fragment.ToLower().Trim()
                      $availableAnchors = $docIndex[$link.TargetBase].Anchors
                      if ($availableAnchors -notcontains $normalizedFragment) {
                          $brokenReferences += @{
                              SourceFile = $link.SourceFile
                              Line = $link.Line
                              Target = "$($link.TargetBase)#$($link.Fragment)"
                              Issue = "Fragment does not exist"
                          }
                      }
                  }
              }
          }
          
          # === Report results ===
          if ($brokenReferences.Count -gt 0) {
              Write-Host "::error::Found $($brokenReferences.Count) broken documentation references"
              
              # Group by source file for cleaner output
              $groupedByFile = $brokenReferences | Group-Object SourceFile
              
              foreach ($group in ($groupedByFile | Sort-Object Name)) {
                  Write-Host "::group::$($group.Name)"
                  
                  foreach ($ref in ($group.Group | Sort-Object Line)) {
                      Write-Host "::error file=$($ref.SourceFile),line=$($ref.Line)::$($ref.Target) - $($ref.Issue)"
                  }
                  Write-Host "::endgroup::"
              }
              
              exit 1
          } else {
              Write-Host "::notice::All documentation references are valid!"
              exit 0
          }
      
      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Documentation validation failed**
              
              Found broken documentation references. Check the workflow logs for details.`
            })

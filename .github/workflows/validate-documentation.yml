name: Validate Documentation

on:
  pull_request:
    paths:
      - 'src/slic3r/GUI/Tab.cpp'
      - 'doc/**/*.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    name: Check Documentation
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            src/slic3r/GUI/Tab.cpp
            doc/**/*.md
      
      - name: Run validation
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: pwsh
        run: |
          $FolderPath = $PWD
          $RelativeTabPath = "src/slic3r/GUI/Tab.cpp"
          
          $tabFile = Join-Path $FolderPath $RelativeTabPath
          $docDir  = Join-Path $FolderPath 'doc'
          
          Write-Host "Validating documentation..." -ForegroundColor Blue
          
          # Check required paths
          if (-not (Test-Path $tabFile)) { 
              Write-Host "::warning::Tab.cpp file not found at: $tabFile"
              $hasTabFile = $false
          } else {
              $hasTabFile = $true
          }
          
          if (-not (Test-Path $docDir)) { 
              Write-Host "::error::doc folder does not exist at: $docDir"
              exit 1 
          }
          
          # === Build documentation index ===
          $docIndex = @{}
          $brokenReferences = @()
          $mdFiles = Get-ChildItem -Path $docDir -Filter *.md -Recurse -File -ErrorAction SilentlyContinue
          
          if ($mdFiles) {
              foreach ($mdFile in $mdFiles) {
                  $baseName = [System.IO.Path]::GetFileNameWithoutExtension($mdFile.Name)
                  $relPath = (Resolve-Path $mdFile.FullName).Path.Substring($docDir.Length).TrimStart('\', '/')
                  $content = Get-Content -Path $mdFile.FullName -Encoding UTF8 -Raw
                  $lines = Get-Content -Path $mdFile.FullName -Encoding UTF8
                  
                  $anchors = @()
                  # Extract HTML anchors (name/id attributes)
                  $anchorMatches = [regex]::Matches($content, '(?i)<a\s+[^>]*(?:name|id)\s*=\s*[`"'']([^`"'']+)[`"''][^>]*>')
                  foreach ($match in $anchorMatches) {
                      $anchors += $match.Groups[1].Value.ToLower()
                  }
                  
                  # Extract Markdown headers as anchors (# ## ### etc.)
                  $headerMatches = [regex]::Matches($content, '(?m)^#+\s+(.+)$')
                  foreach ($match in $headerMatches) {
                      $headerText = $match.Groups[1].Value.Trim()
                      # GitHub-style normalization: lowercase, remove special chars, spaces to hyphens (preserving multiple spaces as multiple hyphens)
                      $anchor = $headerText.ToLower() -replace '[^a-z0-9\s-]', '' -replace ' ', '-' -replace '^-+|-+$', ''
                      $anchors += $anchor
                  }
                  
                  # Parse markdown links
                  $links = @()
                  $linkRegex = '(?<!!)[^\]]*\]\(([^)]+)\)'
                  # Track fenced code blocks to skip link examples inside them
                  $inCodeFence = $false
                  for ($i = 0; $i -lt $lines.Count; $i++) {
                      $line = $lines[$i]
                      if ($line.TrimStart() -match '^(```|~~~)') { $inCodeFence = -not $inCodeFence; continue }
                      if ($inCodeFence) { continue }
                      # Remove inline code spans to avoid parsing `[text](url)` inside backticks
                      $lineForParsing = [regex]::Replace($line, '`[^`]*`', '')
                      foreach ($linkMatch in [regex]::Matches($lineForParsing, $linkRegex)) {
                          $destRaw = $linkMatch.Groups[1].Value.Trim()
                          # Validate internal redirection like [text](#subtitle)
                          if ($destRaw.StartsWith('#')) {
                              $fragment = $destRaw.Substring(1)
                              # If there is more than one #, report as error
                              if ($fragment.Contains('#')) {
                                  $brokenReferences += @{
                                      SourceFile = $relPath
                                      Line = $i + 1
                                      Target = $destRaw
                                      Issue = "Internal link must use only one #."
                                      Type = "Link"
                                  }
                                  continue
                              }
                              # GitHub-style normalization for fragment: lowercase, remove special chars, spaces to hyphens (preserving multiple spaces as multiple hyphens)
                              $normalizedFragment = $fragment.ToLower().Trim() -replace '[^a-z0-9\s-]', '' -replace ' ', '-' -replace '^-+|-+$', ''
                              $availableAnchors = $anchors
                              if ($availableAnchors -notcontains $normalizedFragment) {
                                  $brokenReferences += @{
                                      SourceFile = $relPath
                                      Line = $i + 1
                                      Target = $destRaw
                                      Issue = "Internal fragment does not exist in this file."
                                      Type = "Link"
                                  }
                              }
                              continue
                          }
                          if ($destRaw -match '^(?:https?:|mailto:|data:|#|\\)') { continue }
                          
                          # Check for double ## before splitting
                          if ($destRaw.Contains('##')) {
                              $brokenReferences += @{
                                  SourceFile = $relPath
                                  Line = $i + 1
                                  Target = $destRaw
                                  Issue = "Use single # for fragments."
                                  Type = "Link"
                              }
                              continue
                          }
                          
                          $destParts = $destRaw -split '#', 2
                          $destNoFragment = $destParts[0]
                          $fragment = if ($destParts.Length -gt 1) { $destParts[1] } else { $null }
                          
                          if (-not $destNoFragment) { continue }
                          
                          $leaf = ($destNoFragment -split '[\\/]')[-1]
                          if (-not $leaf) { continue }
                          
                          $targetBase = if ($leaf.ToLower().EndsWith('.md')) { $leaf.Substring(0, $leaf.Length - 3) } else { $leaf }
                          $targetBase = $targetBase.Trim()
                          if (-not $targetBase) { continue }
                          
                          $links += @{
                              TargetBase = $targetBase
                              Fragment = $fragment
                              Line = $i + 1
                              SourceFile = $relPath
                          }
                      }
                  }
                  
                  $docIndex[$baseName] = @{
                      Anchors = $anchors
                      Links = $links
                  }
              }
          }
          
          # === Parse Tab.cpp references ===
          if ($hasTabFile) {
              $regex = 'optgroup->append_single_option_line\s*\(\s*(?:"([^"]+)"|([^,]+?))\s*,\s*"([^"]+)"\s*\)'
              $lines = Get-Content -Path $tabFile -Encoding UTF8
              $tabReferences = @()
              $lineNumber = 0
              
              foreach ($line in $lines) {
                  $lineNumber++
                  foreach ($match in [regex]::Matches($line, $regex)) {
                      $arg2Full = $match.Groups[3].Value.Trim()
                      
                      # Check for double ## before splitting
                      if ($arg2Full.Contains('##')) {
                          $brokenReferences += @{
                              SourceFile = "Tab.cpp"
                              Line = $lineNumber
                              Target = $arg2Full
                              Issue = "Use single # for fragments."
                              Type = "Link"
                          }
                          continue
                      }
                      
                      $arg2Parts = $arg2Full -split '#', 2
                      $arg2Core = $arg2Parts[0].Trim()
                      $fragment = if ($arg2Parts.Length -gt 1) { $arg2Parts[1].Trim() } else { $null }
                      
                      $tabReferences += @{
                          DocBase = $arg2Core
                          Fragment = $fragment
                          Line = $lineNumber
                          SourceFile = "Tab.cpp"
                      }
                  }
              }
              
              # Check Tab.cpp references
              foreach ($ref in $tabReferences) {
                  $docExists = $docIndex.ContainsKey($ref.DocBase)
                  
                  if (-not $docExists) {
                      $brokenReferences += @{
                          SourceFile = $ref.SourceFile
                          Line = $ref.Line
                          Target = "$($ref.DocBase)"
                          Issue = "File does not exist"
                          Type = "Link"
                      }
                  } elseif ($ref.Fragment) {
                      # Remove leading # if present (but allow the search to work)
                      $cleanFragment = $ref.Fragment
                      if ($cleanFragment.StartsWith('#')) {
                          $cleanFragment = $cleanFragment.Substring(1)
                      }
                      
                      $normalizedFragment = $cleanFragment.ToLower().Trim()
                      $normalizedFragment = $normalizedFragment -replace '[^a-z0-9\s-]', '' -replace ' ', '-' -replace '^-+|-+$', ''
                      $availableAnchors = $docIndex[$ref.DocBase].Anchors
                      if ($availableAnchors -notcontains $normalizedFragment) {
                          $brokenReferences += @{
                              SourceFile = $ref.SourceFile
                              Line = $ref.Line
                              Target = "$($ref.DocBase)#$($ref.Fragment)"
                              Issue = "Fragment does not exist"
                              Type = "Link"
                          }
                      }
                  }
              }
          }
          
          # Check markdown links
          foreach ($baseName in $docIndex.Keys) {
              $doc = $docIndex[$baseName]
              
              foreach ($link in $doc.Links) {
                  $targetExists = $docIndex.ContainsKey($link.TargetBase)
                  
                  if (-not $targetExists) {
                      $brokenReferences += @{
                          SourceFile = $link.SourceFile
                          Line = $link.Line
                          Target = "$($link.TargetBase).md"
                          Issue = "File does not exist"
                          Type = "Link"
                      }
                  } elseif ($link.Fragment) {
                      # Remove leading # if present (but allow the search to work)
                      $cleanFragment = $link.Fragment
                      if ($cleanFragment.StartsWith('#')) {
                          $cleanFragment = $cleanFragment.Substring(1)
                      }
                      
                      $normalizedFragment = $cleanFragment.ToLower().Trim()
                      $normalizedFragment = $normalizedFragment -replace '[^a-z0-9\s-]', '' -replace ' ', '-' -replace '^-+|-+$', ''
                      $availableAnchors = $docIndex[$link.TargetBase].Anchors
                      if ($availableAnchors -notcontains $normalizedFragment) {
                          $brokenReferences += @{
                              SourceFile = $link.SourceFile
                              Line = $link.Line
                              Target = "$($link.TargetBase)#$($link.Fragment)"
                              Issue = "Fragment does not exist"
                              Type = "Link"
                          }
                      }
                  }
              }
          }
          
          # === Validate images ===
          Write-Host "Validating images..." -ForegroundColor Blue
          
          $imageReferences = @()
          
          foreach ($file in $mdFiles) {
              $lines = Get-Content $file.FullName -Encoding UTF8
              $relPath = (Resolve-Path $file.FullName).Path.Substring($docDir.Length).TrimStart('\', '/')
              
              # Track fenced code blocks so we don't parse examples inside them as real images
              $inCodeFence = $false
              for ($lineNumber = 0; $lineNumber -lt $lines.Count; $lineNumber++) {
                  $line = $lines[$lineNumber]
                  # Detect start/end of fenced code blocks (``` or ~~~). Toggle state and skip the fence line itself.
                  if ($line.TrimStart() -match '^(```|~~~)') {
                      $inCodeFence = -not $inCodeFence
                      continue
                  }
                  if ($inCodeFence) { continue }
                  
                  # Remove inline code spans delimited by backticks to avoid false positives like `![alt](url)` examples
                  $lineForParsing = [regex]::Replace($line, '`[^`]*`', '')
                  
                  # Parse markdown images: ![alt](url)
                  foreach ($match in [regex]::Matches($lineForParsing, "!\[([^\]]*)\]\(([^)]+)\)")) {
                      $altText = $match.Groups[1].Value
                      $url = $match.Groups[2].Value
                      
                      if (-not $altText.Trim()) {
                          # Report missing alt text
                          $brokenReferences += @{
                              SourceFile = $relPath
                              Line = $lineNumber + 1
                              Issue = "[Markdown] Missing alt text for image"
                              Target = $match.Value
                              Type = "Image"
                          }
                      } else {
                          $imageReferences += @{
                              SourceFile = $relPath
                              Line = $lineNumber + 1
                              AltText = $altText
                              Url = $url
                              FullMatch = $match.Value
                              ImageType = "Markdown"
                          }
                      }
                  }
                  
                  # Parse HTML images: <img ...>
                  foreach ($match in [regex]::Matches($lineForParsing, '<img\s+[^>]*>')) {
                      $imgTag = $match.Value
                      $altText = ""
                      $src = ""
                      
                      # Extract alt and src from HTML (more flexible matching)
                      if ($imgTag -match 'alt\s*=\s*[`"'']([^`"'']*)[`"'']') { $altText = $matches[1] }
                      if ($imgTag -match 'src\s*=\s*[`"'']([^`"'']*)[`"'']') { $src = $matches[1] }
                      
                      # Only add if both src and alt are present
                      if ($src -and $altText) {
                          $imageReferences += @{
                              SourceFile = $relPath
                              Line = $lineNumber + 1
                              AltText = $altText
                              Url = $src
                              FullMatch = $match.Value
                              ImageType = "HTML"
                          }
                      } elseif ($src -and -not $altText) {
                          # Report missing alt text
                          $brokenReferences += @{
                              SourceFile = $relPath
                              Line = $lineNumber + 1
                              Issue = "[HTML] Missing alt attribute for image"
                              Target = $match.Value
                              Type = "Image"
                          }
                      }
                  }
              }
          }
          
          # Validate images
          $expectedUrlPattern = '^https://github\.com/SoftFever/OrcaSlicer/blob/main/([^?]+)\?raw=true$'
          
          foreach ($imgRef in $imageReferences) {
              # Check URL format
              if ($imgRef.Url -match $expectedUrlPattern) {
                  $relativePathInUrl = $matches[1]
                  $fileNameFromUrl = [System.IO.Path]::GetFileNameWithoutExtension($relativePathInUrl)
                  
                  # Check if alt text matches filename
                  if ($imgRef.AltText -ne $fileNameFromUrl) {
                      $brokenReferences += @{
                          SourceFile = $imgRef.SourceFile
                          Line = $imgRef.Line
                          Issue = "[$($imgRef.ImageType)] Alt text `"$($imgRef.AltText)`" ≠ filename `"$fileNameFromUrl`""
                          Target = $imgRef.FullMatch
                          Type = "Image"
                      }
                  }
                  
                  # Check if image file exists at expected path
                  $expectedImagePath = Join-Path $FolderPath ($relativePathInUrl -replace "/", "\")
                  if (-not (Test-Path $expectedImagePath)) {
                      $brokenReferences += @{
                          SourceFile = $imgRef.SourceFile
                          Line = $imgRef.Line
                          Issue = "[$($imgRef.ImageType)] Image not found at path: $relativePathInUrl"
                          Target = $imgRef.FullMatch
                          Type = "Image"
                      }
                  }
                  
              } else {
                  # Provide more specific error messages for URL format issues
                  $urlIssues = @()
                  
                  if (-not $imgRef.Url.StartsWith('https://github.com/SoftFever/OrcaSlicer/blob/main/')) {
                      $urlIssues += "URL must start with 'https://github.com/SoftFever/OrcaSlicer/blob/main/'"
                  }
                  
                  if (-not $imgRef.Url.EndsWith('?raw=true')) {
                      $urlIssues += "URL must end with '?raw=true'"
                  }
                  
                  if ($imgRef.Url -match '^https?://(?!github\.com/SoftFever/OrcaSlicer)') {
                      $urlIssues += "External URLs are not allowed."
                  }
                  
                  $issueText = if ($urlIssues.Count -gt 0) { 
                      "[$($imgRef.ImageType)] URL format issues: " + ($urlIssues -join '; ')
                  } else { 
                      "[$($imgRef.ImageType)] URL format does not match expected pattern: https://github.com/SoftFever/OrcaSlicer/blob/main/path/to/image?raw=true" 
                  }
                  
                  $brokenReferences += @{
                      SourceFile = $imgRef.SourceFile
                      Line = $imgRef.Line
                      Issue = $issueText
                      Target = $imgRef.FullMatch
                      Type = "Image"
                  }
              }
          }
          
          # === Report results ===
          $linkErrors = $brokenReferences | Where-Object { $_.Type -eq "Link" }
          $imageErrors = $brokenReferences | Where-Object { $_.Type -eq "Image" }
          
          if ($brokenReferences.Count -gt 0) {
              Write-Host "::error::Found $($brokenReferences.Count) validation errors ($($linkErrors.Count) link errors, $($imageErrors.Count) image errors)"
              
              # Build error summary for PR comment
              $errorSummary = ""
              
              if ($linkErrors.Count -gt 0) {
                  Write-Host "::group::🔗 Link Validation Errors"
                  $errorSummary += "## 🔗 Link Validation Errors ($($linkErrors.Count))`n`n"
                  $groupedByFile = $linkErrors | Group-Object SourceFile
                  foreach ($group in ($groupedByFile | Sort-Object Name)) {
                      Write-Host "📄 $($group.Name):" -ForegroundColor Yellow
                      $errorSummary += "**📄 $($group.Name):**`n"
                      foreach ($ref in ($group.Group | Sort-Object Line)) {
                          Write-Host "::error file=$($ref.SourceFile),line=$($ref.Line)::$($ref.Target) - $($ref.Issue)"
                          $errorSummary += "- Line $($ref.Line): ``$($ref.Target)`` - $($ref.Issue)`n"
                      }
                      $errorSummary += "`n"
                  }
                  Write-Host "::endgroup::"
              }
              
              if ($imageErrors.Count -gt 0) {
                  Write-Host "::group::🖼️ Image Validation Errors"
                  $errorSummary += "## 🖼️ Image Validation Errors ($($imageErrors.Count))`n`n"
                  $groupedByFile = $imageErrors | Group-Object SourceFile
                  foreach ($group in ($groupedByFile | Sort-Object Name)) {
                      Write-Host "📄 $($group.Name):" -ForegroundColor Yellow
                      $errorSummary += "**📄 doc/$($group.Name):**`n"
                      foreach ($ref in ($group.Group | Sort-Object Line)) {
                          Write-Host "::error file=doc/$($ref.SourceFile),line=$($ref.Line)::$($ref.Issue)"
                          $errorSummary += "- Line $($ref.Line): $($ref.Issue)`n"
                      }
                      $errorSummary += "`n"
                  }
                  Write-Host "::endgroup::"
              }
              
              # Export error summary for PR comment
              Add-Content -Path $env:GITHUB_ENV -Value "VALIDATION_ERRORS<<EOF"
              Add-Content -Path $env:GITHUB_ENV -Value $errorSummary
              Add-Content -Path $env:GITHUB_ENV -Value "EOF"
              Add-Content -Path $env:GITHUB_ENV -Value "ERROR_COUNT=$($brokenReferences.Count)"
              Add-Content -Path $env:GITHUB_ENV -Value "LINK_ERROR_COUNT=$($linkErrors.Count)"
              Add-Content -Path $env:GITHUB_ENV -Value "IMAGE_ERROR_COUNT=$($imageErrors.Count)"
              
              exit 1
          } else {
              Write-Host "::notice::All documentation is valid!"
              exit 0
          }
      
      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const errorCount = process.env.ERROR_COUNT || '0';
            const linkErrorCount = process.env.LINK_ERROR_COUNT || '0';
            const imageErrorCount = process.env.IMAGE_ERROR_COUNT || '0';
            const validationErrors = process.env.VALIDATION_ERRORS || '';
            
            let body = `❌ **Documentation validation failed**
            
            Found ${errorCount} validation errors (${linkErrorCount} link errors, ${imageErrorCount} image errors).`;
            
            if (validationErrors) {
              body += `\n\n${validationErrors}`;
            } else {
              body += `\n\nCheck the workflow logs for details.`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

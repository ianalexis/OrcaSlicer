name: Validate Documentation

on:
  pull_request:
    paths:
      - 'src/slic3r/GUI/Tab.cpp'
      - 'doc/**/*.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    name: Check Documentation
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            src/slic3r/GUI/Tab.cpp
            doc/**/*.md
      
      - name: Run validation
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: pwsh
        run: |
          $FolderPath = $PWD
          $RelativeTabPath = "src/slic3r/GUI/Tab.cpp"
          
          $tabFile = Join-Path $FolderPath $RelativeTabPath
          $docDir  = Join-Path $FolderPath 'doc'
          
          Write-Host "Validating documentation..." -ForegroundColor Blue
          
          # Check required paths
          if (-not (Test-Path $tabFile)) { 
              Write-Host "::warning::Tab.cpp file not found at: $tabFile"
              $hasTabFile = $false
          } else {
              $hasTabFile = $true
          }
          
          if (-not (Test-Path $docDir)) { 
              Write-Host "::error::doc folder does not exist at: $docDir"
              exit 1 
          }
          
          # === Build documentation index ===
          $docIndex = @{}
          $mdFiles = Get-ChildItem -Path $docDir -Filter *.md -Recurse -File -ErrorAction SilentlyContinue
          
          if ($mdFiles) {
              foreach ($mdFile in $mdFiles) {
                  $baseName = [System.IO.Path]::GetFileNameWithoutExtension($mdFile.Name)
                  $relPath = (Resolve-Path $mdFile.FullName).Path.Substring($docDir.Length).TrimStart('\', '/')
                  $content = Get-Content -Path $mdFile.FullName -Encoding UTF8 -Raw
                  $lines = Get-Content -Path $mdFile.FullName -Encoding UTF8
                  
                  # Extract anchors
                  $anchors = @()
                  $headerMatches = [regex]::Matches($content, '(?m)^(#+)\s+(.+)$')
                  foreach ($match in $headerMatches) {
                      $headerText = $match.Groups[2].Value.Trim()
                      $headerAnchor = $headerText.ToLower() -replace '\s+', '-' -replace '[^\w\-]', ''
                      $anchors += $headerAnchor
                      $anchors += $headerText.ToLower().Trim()
                  }
                  
                  $anchorMatches = [regex]::Matches($content, '(?i)<a\s+[^>]*(?:name|id)\s*=\s*[`"'']([^`"'']+)[`"''][^>]*>')
                  foreach ($match in $anchorMatches) {
                      $anchors += $match.Groups[1].Value.ToLower()
                  }
                  
                  # Parse markdown links
                  $links = @()
                  $linkRegex = '(?<!!)\[[^\]]*\]\(([^)]+)\)'
                  for ($i = 0; $i -lt $lines.Count; $i++) {
                      foreach ($linkMatch in [regex]::Matches($lines[$i], $linkRegex)) {
                          $destRaw = $linkMatch.Groups[1].Value.Trim()
                          if ($destRaw -match '^(?:https?:|mailto:|data:|#|\\)') { continue }
                          
                          $destParts = $destRaw -split '#', 2
                          $destNoFragment = $destParts[0]
                          $fragment = if ($destParts.Length -gt 1) { $destParts[1] } else { $null }
                          
                          if (-not $destNoFragment) { continue }
                          
                          $leaf = ($destNoFragment -split '[\\/]')[-1]
                          if (-not $leaf) { continue }
                          
                          $targetBase = if ($leaf.ToLower().EndsWith('.md')) { $leaf.Substring(0, $leaf.Length - 3) } else { $leaf }
                          $targetBase = $targetBase.Trim()
                          if (-not $targetBase) { continue }
                          
                          $links += @{
                              TargetBase = $targetBase
                              Fragment = $fragment
                              Line = $i + 1
                              SourceFile = $relPath
                          }
                      }
                  }
                  
                  $docIndex[$baseName] = @{
                      Anchors = $anchors
                      Links = $links
                  }
              }
          }
          
          $brokenReferences = @()
          
          # === Parse Tab.cpp references ===
          if ($hasTabFile) {
              $regex = 'optgroup->append_single_option_line\s*\(\s*(?:"([^"]+)"|([^,]+?))\s*,\s*"([^"]+)"\s*\)'
              $lines = Get-Content -Path $tabFile -Encoding UTF8
              $tabReferences = @()
              $lineNumber = 0
              
              foreach ($line in $lines) {
                  $lineNumber++
                  foreach ($match in [regex]::Matches($line, $regex)) {
                      $arg2Full = $match.Groups[3].Value.Trim()
                      $arg2Parts = $arg2Full -split '#', 2
                      $arg2Core = $arg2Parts[0].Trim()
                      $fragment = if ($arg2Parts.Length -gt 1) { $arg2Parts[1].Trim() } else { $null }
                      
                      $tabReferences += @{
                          DocBase = $arg2Core
                          Fragment = $fragment
                          Line = $lineNumber
                          SourceFile = "Tab.cpp"
                      }
                  }
              }
              
              # Check Tab.cpp references
              foreach ($ref in $tabReferences) {
                  $docExists = $docIndex.ContainsKey($ref.DocBase)
                  
                  if ($ref.Fragment -and $ref.Fragment.StartsWith('#')) {
                      $brokenReferences += @{
                          SourceFile = $ref.SourceFile
                          Line = $ref.Line
                          Target = "$($ref.DocBase)#$($ref.Fragment)"
                          Issue = "Double ## reference is not allowed"
                          Type = "Link"
                      }
                  } elseif (-not $docExists) {
                      $brokenReferences += @{
                          SourceFile = $ref.SourceFile
                          Line = $ref.Line
                          Target = "$($ref.DocBase)"
                          Issue = "File does not exist"
                          Type = "Link"
                      }
                  } elseif ($ref.Fragment) {
                      $normalizedFragment = $ref.Fragment.ToLower().Trim()
                      $availableAnchors = $docIndex[$ref.DocBase].Anchors
                      if ($availableAnchors -notcontains $normalizedFragment) {
                          $brokenReferences += @{
                              SourceFile = $ref.SourceFile
                              Line = $ref.Line
                              Target = "$($ref.DocBase)#$($ref.Fragment)"
                              Issue = "Fragment does not exist"
                              Type = "Link"
                          }
                      }
                  }
              }
          }
          
          # Check markdown links
          foreach ($baseName in $docIndex.Keys) {
              $doc = $docIndex[$baseName]
              
              foreach ($link in $doc.Links) {
                  $targetExists = $docIndex.ContainsKey($link.TargetBase)
                  
                  if ($link.Fragment -and $link.Fragment.StartsWith('#')) {
                      $brokenReferences += @{
                          SourceFile = $link.SourceFile
                          Line = $link.Line
                          Target = "$($link.TargetBase).md#$($link.Fragment)"
                          Issue = "Double ## reference is not allowed"
                          Type = "Link"
                      }
                  } elseif (-not $targetExists) {
                      $brokenReferences += @{
                          SourceFile = $link.SourceFile
                          Line = $link.Line
                          Target = "$($link.TargetBase).md"
                          Issue = "File does not exist"
                          Type = "Link"
                      }
                  } elseif ($link.Fragment) {
                      $normalizedFragment = $link.Fragment.ToLower().Trim()
                      $availableAnchors = $docIndex[$link.TargetBase].Anchors
                      if ($availableAnchors -notcontains $normalizedFragment) {
                          $brokenReferences += @{
                              SourceFile = $link.SourceFile
                              Line = $link.Line
                              Target = "$($link.TargetBase)#$($link.Fragment)"
                              Issue = "Fragment does not exist"
                              Type = "Link"
                          }
                      }
                  }
              }
          }
          
          # === Validate images ===
          Write-Host "Validating images..." -ForegroundColor Blue
          
          $imageReferences = @()
          
          foreach ($file in $mdFiles) {
              $lines = Get-Content $file.FullName -Encoding UTF8
              $relPath = (Resolve-Path $file.FullName).Path.Substring($docDir.Length).TrimStart('\', '/')
              
              for ($lineNumber = 0; $lineNumber -lt $lines.Count; $lineNumber++) {
                  $line = $lines[$lineNumber]
                  
                  # Parse markdown images: ![alt](url)
                  foreach ($match in [regex]::Matches($line, "!\[([^\]]*)\]\(([^)]+)\)")) {
                      $imageReferences += @{
                          SourceFile = $relPath
                          Line = $lineNumber + 1
                          AltText = $match.Groups[1].Value
                          Url = $match.Groups[2].Value
                          FullMatch = $match.Value
                          ImageType = "Markdown"
                      }
                  }
                  
                  # Parse HTML images: <img ...>
                  foreach ($match in [regex]::Matches($line, '<img\s+((src="[^\"]*"\s+alt="[^\"]*")|(alt="[^\"]*"\s+src="[^\"]*"))[^>]*>')) {
                      $imgTag = $match.Value
                      $altText = ""
                      $src = ""
                      
                      # Extract alt and src from HTML
                      if ($imgTag -match 'alt="([^"]*)"') { $altText = $matches[1] }
                      if ($imgTag -match 'src="([^"]*)"') { $src = $matches[1] }
                      
                      $imageReferences += @{
                          SourceFile = $relPath
                          Line = $lineNumber + 1
                          AltText = $altText
                          Url = $src
                          FullMatch = $match.Value
                          ImageType = "HTML"
                      }
                  }
              }
          }
          
          # Validate images
          $expectedUrlPattern = '^https://github\.com/SoftFever/OrcaSlicer/blob/main/([^?]+)\?raw=true$'
          
          foreach ($imgRef in $imageReferences) {
              # Check URL format
              if ($imgRef.Url -match $expectedUrlPattern) {
                  $relativePathInUrl = $matches[1]
                  $fileNameFromUrl = [System.IO.Path]::GetFileNameWithoutExtension($relativePathInUrl)
                  
                  # Check if alt text matches filename
                  if ($imgRef.AltText -ne $fileNameFromUrl) {
                      $brokenReferences += @{
                          SourceFile = $imgRef.SourceFile
                          Line = $imgRef.Line
                          Issue = "[$($imgRef.ImageType)] Alt text `"$($imgRef.AltText)`" ≠ filename `"$fileNameFromUrl`""
                          Target = $imgRef.FullMatch
                          Type = "Image"
                      }
                  }
                  
                  # Check if image file exists at expected path
                  $expectedImagePath = Join-Path $FolderPath ($relativePathInUrl -replace "/", "\")
                  if (-not (Test-Path $expectedImagePath)) {
                      $brokenReferences += @{
                          SourceFile = $imgRef.SourceFile
                          Line = $imgRef.Line
                          Issue = "[$($imgRef.ImageType)] Image not found at path: $relativePathInUrl"
                          Target = $imgRef.FullMatch
                          Type = "Image"
                      }
                  }
                  
              } else {
                  $brokenReferences += @{
                      SourceFile = $imgRef.SourceFile
                      Line = $imgRef.Line
                      Issue = "[$($imgRef.ImageType)] URL format does not match expected pattern"
                      Target = $imgRef.FullMatch
                      Type = "Image"
                  }
              }
          }
          
          # === Report results ===
          $linkErrors = $brokenReferences | Where-Object { $_.Type -eq "Link" }
          $imageErrors = $brokenReferences | Where-Object { $_.Type -eq "Image" }
          
          if ($brokenReferences.Count -gt 0) {
              Write-Host "::error::Found $($brokenReferences.Count) validation errors ($($linkErrors.Count) link errors, $($imageErrors.Count) image errors)"
              
              if ($linkErrors.Count -gt 0) {
                  Write-Host "::group::🔗 Link Validation Errors"
                  $groupedByFile = $linkErrors | Group-Object SourceFile
                  foreach ($group in ($groupedByFile | Sort-Object Name)) {
                      Write-Host "📄 $($group.Name):" -ForegroundColor Yellow
                      foreach ($ref in ($group.Group | Sort-Object Line)) {
                          Write-Host "::error file=$($ref.SourceFile),line=$($ref.Line)::$($ref.Target) - $($ref.Issue)"
                      }
                  }
                  Write-Host "::endgroup::"
              }
              
              if ($imageErrors.Count -gt 0) {
                  Write-Host "::group::🖼️ Image Validation Errors"
                  $groupedByFile = $imageErrors | Group-Object SourceFile
                  foreach ($group in ($groupedByFile | Sort-Object Name)) {
                      Write-Host "📄 $($group.Name):" -ForegroundColor Yellow
                      foreach ($ref in ($group.Group | Sort-Object Line)) {
                          Write-Host "::error file=doc/$($ref.SourceFile),line=$($ref.Line)::$($ref.Issue)"
                      }
                  }
                  Write-Host "::endgroup::"
              }
              
              exit 1
          } else {
              Write-Host "::notice::All documentation is valid!"
              exit 0
          }
      
      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Documentation validation failed**
              
              Found issues with documentation. Check the workflow logs for details.`
            })
      
      - name: Success comment
        if: success() && github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Documentation validation passed**`
            })

name: Validate Documentation Images

on:
  pull_request:
    paths:
      - 'doc/**/*.md'
  workflow_dispatch:

jobs:
  validate-images:
    runs-on: windows-latest
    name: Check Documentation Images
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run validation
        shell: pwsh
        run: |
          $FolderPath = $PWD
          $docPath = Join-Path $FolderPath "doc"
          
          # Check required paths
          if (-not (Test-Path $FolderPath)) { Write-Error "The folder '$FolderPath' does not exist."; exit 1 }
          if (-not (Test-Path $docPath)) { Write-Error 'The "doc" folder does not exist inside the specified repository.'; exit 1 }
          
          # === Parse markdown files for image references ===
          $mdFiles = Get-ChildItem -Path $docPath -Filter "*.md" -Recurse
          if (-not $mdFiles) { 
              Write-Host "::notice::No .md files found in doc folder."
              exit 0 
          }
          
          $imageReferences = @()
          
          foreach ($file in $mdFiles) {
              $lines = Get-Content $file.FullName -Encoding UTF8
              $relPath = (Resolve-Path $file.FullName).Path.Substring($docPath.Length).TrimStart('\', '/')
              
              for ($lineNumber = 0; $lineNumber -lt $lines.Count; $lineNumber++) {
                  $line = $lines[$lineNumber]
                  
                  # Parse markdown images: ![alt](url)
                  foreach ($match in [regex]::Matches($line, "!\[([^\]]*)\]\(([^)]+)\)")) {
                      $imageReferences += @{
                          Type = "Markdown"
                          SourceFile = $relPath
                          Line = $lineNumber + 1
                          AltText = $match.Groups[1].Value
                          Url = $match.Groups[2].Value
                          FullMatch = $match.Value
                      }
                  }
                  
                  # Parse HTML images: <img ...>
                  foreach ($match in [regex]::Matches($line, '<img\s+((src="[^\"]*"\s+alt="[^\"]*")|(alt="[^\"]*"\s+src="[^\"]*"))[^>]*>')) {
                      $imgTag = $match.Value
                      $altText = ""
                      $src = ""
                      
                      # Extract alt and src from HTML
                      if ($imgTag -match 'alt="([^"]*)"') { $altText = $matches[1] }
                      if ($imgTag -match 'src="([^"]*)"') { $src = $matches[1] }
                      
                      $imageReferences += @{
                          Type = "HTML"
                          SourceFile = $relPath
                          Line = $lineNumber + 1
                          AltText = $altText
                          Url = $src
                          FullMatch = $match.Value
                      }
                  }
              }
          }
          
          # === Validate and collect broken references ===
          $brokenReferences = @()
          $expectedUrlPattern = '^https://github\.com/SoftFever/OrcaSlicer/blob/main/([^?]+)\?raw=true$'
          
          foreach ($imgRef in $imageReferences) {
              # Check URL format
              if ($imgRef.Url -match $expectedUrlPattern) {
                  $relativePathInUrl = $matches[1]
                  $fileNameFromUrl = [System.IO.Path]::GetFileNameWithoutExtension($relativePathInUrl)
                  
                  # Check if alt text matches filename
                  if ($imgRef.AltText -ne $fileNameFromUrl) {
                      $brokenReferences += @{
                          SourceFile = $imgRef.SourceFile
                          Line = $imgRef.Line
                          Issue = "Alt text `"$($imgRef.AltText)`" ≠ filename `"$fileNameFromUrl`""
                          FullMatch = $imgRef.FullMatch
                          Type = $imgRef.Type
                      }
                  }
                  
                  # Check if image file exists at expected path
                  $expectedImagePath = Join-Path $FolderPath ($relativePathInUrl -replace "/", "\")
                  if (-not (Test-Path $expectedImagePath)) {
                      $brokenReferences += @{
                          SourceFile = $imgRef.SourceFile
                          Line = $imgRef.Line
                          Issue = "Image not found at path: $relativePathInUrl"
                          FullMatch = $imgRef.FullMatch
                          Type = $imgRef.Type
                      }
                  }
                  
              } else {
                  $brokenReferences += @{
                      SourceFile = $imgRef.SourceFile
                      Line = $imgRef.Line
                      Issue = "URL format does not match expected pattern"
                      FullMatch = $imgRef.FullMatch
                      Type = $imgRef.Type
                  }
              }
          }
          
          # === Report results ===
          if ($brokenReferences.Count -gt 0) {
              Write-Host "::error::Found $($brokenReferences.Count) broken image references"
              
              # Group by source file for cleaner output
              $groupedByFile = $brokenReferences | Group-Object SourceFile
              
              foreach ($group in ($groupedByFile | Sort-Object Name)) {
                  Write-Host "::group::$($group.Name)"
                  
                  foreach ($ref in ($group.Group | Sort-Object Line)) {
                      Write-Host "::error file=doc/$($ref.SourceFile),line=$($ref.Line)::[$($ref.Type)] $($ref.Issue)"
                      Write-Host "    Reference: $($ref.FullMatch)"
                  }
                  Write-Host "::endgroup::"
              }
              
              exit 1
          } else {
              Write-Host "::notice::All image references are valid!"
              exit 0
          }
      
      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Image validation failed**
              
              Found issues with image references. Check the workflow logs for details.`
            })

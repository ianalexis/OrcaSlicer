
name: Check Wiki Images

on:
  pull_request:
    paths:
      - 'doc/**/*.md'
  workflow_dispatch:

jobs:
  check-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find changed markdown files
        id: md_files
        run: |
          echo "files=$(git diff --name-only origin/main...HEAD | grep '^doc/.*\\.md$' | xargs)" >> $GITHUB_OUTPUT

      - name: Validate image links in markdown files
        if: steps.md_files.outputs.files != ''
        run: |
          failed=0
          for file in ${{ steps.md_files.outputs.files }}; do
            echo "Checking $file..."
            lineno=0
            while IFS= read -r line; do
              lineno=$((lineno+1))
              # Check for markdown image syntax
              if [[ "$line" =~ !\[.*\]\(([^)]+)\) ]]; then
                img_url="${BASH_REMATCH[1]}"
                # Check if it matches the required format
                if [[ ! "$img_url" =~ ^https://github\.com/SoftFever/OrcaSlicer/blob/main/doc/images/.*\?raw=true$ ]]; then
                  echo "❌ ERROR in $file at line $lineno:"
                  echo "   Line content: $line"
                  echo "   Image URL found: $img_url"
                  echo "   Expected format: https://github.com/SoftFever/OrcaSlicer/blob/main/doc/images/[path]?raw=true"
                  echo ""
                  failed=1
                fi
              fi
            done < "$file"
          done
          if [ $failed -ne 0 ]; then
            echo ""
            echo "❌ At least one image does not meet the required format."
            echo "All images in wiki documentation must use absolute GitHub URLs with '?raw=true' parameter."
            exit 1
          else
            echo "✅ All images meet the required format."
          fi

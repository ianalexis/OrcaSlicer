name: Check Wiki Doc

on:
  pull_request:
    branches:
      - main
    paths:
      - 'doc/**/*.md'
      - ".github/workflows/check_wiki_doc.yml"
  
  push:
    branches:
      - main
    paths:
      - 'doc/**/*.md'
      - ".github/workflows/check_wiki_doc.yml"

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

jobs:
  check_image_links:
    name: Check Image Links in Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check for relative image paths and missing raw=true
        id: check_paths
        run: |
          echo "Checking for image issues in doc/ folder..."
          echo "Current directory: $(pwd)"
          echo "Available files:"
          ls -la
          
          # Check if doc folder exists
          if [ ! -d "doc" ]; then
            echo "⚠️ Warning: doc/ folder not found in workspace"
            echo "Available directories:"
            find . -type d -name "*doc*" 2>/dev/null || echo "No doc-related directories found"
            echo "This might be normal for some triggers. Exiting gracefully."
            echo "found_issues=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Search for .md files in doc/ folder
          found_issues=false
          error_details=""
          
          # Search for problematic patterns in .md files
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Checking file: $file"
              
              line_num=1
              while IFS= read -r line; do
                # Check for any image that doesn't use the correct GitHub URL format
                if echo "$line" | grep -E '!\[.*\]\(' > /dev/null; then
                  echo "DEBUG: Found image line: $line"
                  
                  # Check if it's NOT using the correct GitHub URL format
                  if ! echo "$line" | grep -E '!\[.*\]\(https://github\.com/[^/]+/[^/]+/blob/main/doc/images/.*\?raw=true\)' > /dev/null; then
                    found_issues=true
                    issue_line="File: $file, Line: $line_num - INCORRECT IMAGE URL: $line"
                    echo "❌ INCORRECT IMAGE URL: $issue_line"
                    error_details="${error_details}${issue_line}\n"
                  fi
                fi
                
                ((line_num++))
              done < "$file"
            fi
          done < <(find doc/ -name "*.md" -type f 2>/dev/null || true)
          
          if [ "$found_issues" = true ]; then
            echo "found_issues=true" >> $GITHUB_OUTPUT
            echo "error_details<<EOF" >> $GITHUB_OUTPUT
            echo -e "$error_details" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "found_issues=false" >> $GITHUB_OUTPUT
            echo "✅ No image issues found!"
          fi

      - name: Create comment for PR (if issues found)
        if: github.event_name == 'pull_request' && steps.check_paths.outputs.found_issues == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "⚠️ Image URL Issues Found in Documentation" > comment.md
            echo "" >> comment.md
            echo "Images were found that don't use the correct GitHub URL format for Wiki compatibility." >> comment.md
            echo "" >> comment.md
            echo "### Files with issues:" >> comment.md
            echo '```' >> comment.md
            echo "${{ steps.check_paths.outputs.error_details }}" >> comment.md
            echo '```' >> comment.md
            echo "" >> comment.md
            echo "### ✅ Required solution:" >> comment.md
            echo "All images in documentation must use the full GitHub URL format:" >> comment.md
            echo "" >> comment.md
            echo "**✅ Correct format:**" >> comment.md
            echo "\`![filename](https://github.com/SoftFever/OrcaSlicer/blob/main/doc/images/filename.png?raw=true)\`" >> comment.md
            echo "" >> comment.md
            echo "### ❌ Common incorrect formats:" >> comment.md
            echo "- \`![image](../images/file.png)\` (relative path)" >> comment.md
            echo "- \`![image](../../images/file.png)\` (relative path)" >> comment.md  
            echo "- \`![image](/images/file.png)\` (absolute path)" >> comment.md
            echo "- \`![image](https://github.com/.../file.png)\` (missing ?raw=true)" >> comment.md
            echo "- \`![wrongname](https://github.com/.../correctname.png?raw=true)\` (alt text mismatch)" >> comment.md
            echo "" >> comment.md
            echo "### 📝 Examples:" >> comment.md
            echo '```markdown' >> comment.md
            echo "# ❌ Before" >> comment.md
            echo "![example](../images/my-image.png)" >> comment.md
            echo "![example](/images/my-image.png)" >> comment.md
            echo "" >> comment.md
            echo "# ✅ After" >> comment.md
            echo "![my-image](https://github.com/SoftFever/OrcaSlicer/blob/main/doc/images/my-image.png?raw=true)" >> comment.md
            echo '```' >> comment.md
            echo "" >> comment.md
            echo "Please fix these image URLs before merging the PR." >> comment.md
            
            echo "Comment created in comment.md file"
            cat comment.md
            echo ""
            echo "Note: Automatic PR commenting is disabled due to action restrictions in fork."
            echo "Please review the issues above manually."
          fi

      - name: Fail if issues found
        if: steps.check_paths.outputs.found_issues == 'true'
        run: |
          echo "❌ Incorrect image URLs found that need to be corrected."
          echo ""
          echo "All images in documentation must use the correct GitHub URL format:"
          echo "![filename](https://github.com/SoftFever/OrcaSlicer/blob/main/doc/images/filename.png?raw=true)"
          echo ""
          echo "This ensures images display properly in GitHub Wiki."
          exit 1

      - name: Success message
        if: steps.check_paths.outputs.found_issues == 'false'
        run: |
          echo "✅ Perfect! All images use the correct GitHub URL format."
